## ======================================================================================
## Hexo Theme Keep 4.x 配置（由 source/_data/keep.yml 迁移，2026-10-18）
## 文档: https://keep-docs.xpoet.cn
## ======================================================================================

# ---------------------------------------------------------------------------------------
# 基础信息
# ---------------------------------------------------------------------------------------
base_info:
  primary_color: "#0066CC"
  title: Joyer
  author: Joyer Lee
  avatar: /images/avatar.jpg
  logo: /images/avatar.jpg
  favicon: /images/avatar.jpg

# ---------------------------------------------------------------------------------------
# 导航菜单
# ---------------------------------------------------------------------------------------
menu:
  home: /
  archives: /archives

# ---------------------------------------------------------------------------------------
# 首屏
# ---------------------------------------------------------------------------------------
first_screen:
  enable: true
  background_img: /images/bg.svg
  background_img_dark: /images/bg.svg
  description: 细线常锯木必断，檐水久滴石必穿
  hitokoto: false

# ---------------------------------------------------------------------------------------
# 社交联系方式
# ---------------------------------------------------------------------------------------
social_contact:
  enable: true
  links:
    github: https://github.com/joyer-lee
    email: joyer_lee@163.com

# ---------------------------------------------------------------------------------------
# 滚动
# ---------------------------------------------------------------------------------------
scroll:
  progress_bar: false
  percent: false
  hide_header: true

# ---------------------------------------------------------------------------------------
# 首页文章块
# ---------------------------------------------------------------------------------------
home:
  category: true
  tag: true
  post_datetime: updated

# ---------------------------------------------------------------------------------------
# 文章页
# ---------------------------------------------------------------------------------------
post:
  author_badge:
    enable: true
    level_badge: true
    custom_badge: ["Trainee", "Engineer", "Architect", "CTO", "BOSS"]
  word_count:
    wordcount: true
    min2read: true
  datetime_format: "YYYY-MM-DD HH:mm:ss"
  copyright_info: true
  share: false
  reward:
    enable: false

# ---------------------------------------------------------------------------------------
# 代码块
# ---------------------------------------------------------------------------------------
code_block:
  tools:
    enable: false
    style: default
  highlight_theme: default

# ---------------------------------------------------------------------------------------
# 目录
# ---------------------------------------------------------------------------------------
toc:
  enable: true
  number: true
  expand_all: true
  init_open: false
  layout: right

# ---------------------------------------------------------------------------------------
# 网站统计
# ---------------------------------------------------------------------------------------
website_count:
  busuanzi_count:
    enable: false
    site_uv: false
    site_pv: false
    page_pv: false

# ---------------------------------------------------------------------------------------
# 本地搜索（依赖 hexo-generator-searchdb）
# ---------------------------------------------------------------------------------------
local_search:
  enable: true
  preload: false

# ---------------------------------------------------------------------------------------
# 评论（未启用）
# ---------------------------------------------------------------------------------------
comment:
  enable: false
  use: valine

# ---------------------------------------------------------------------------------------
# RSS（依赖 hexo-generator-feed）
# ---------------------------------------------------------------------------------------
rss:
  enable: true

# ---------------------------------------------------------------------------------------
# 图片懒加载
# ---------------------------------------------------------------------------------------
lazyload:
  enable: false

# ---------------------------------------------------------------------------------------
# CDN
# ---------------------------------------------------------------------------------------
cdn:
  enable: false
  provider: cdnjs
  custom:
    enable: false
    url:

# ---------------------------------------------------------------------------------------
# Pjax
# ---------------------------------------------------------------------------------------
pjax:
  enable: false

# ---------------------------------------------------------------------------------------
# 页脚
# ---------------------------------------------------------------------------------------
footer:
  since: 2022
  word_count: false
